<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicializar Base de Datos</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #1a1a1a; color: white; }
        button { padding: 15px 30px; font-size: 1.1rem; background: #C41E3A; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
        button:disabled { background: #555; }
        #status { margin-top: 20px; color: #b0b0b0; }
    </style>
</head>
<body>
    <h1>🚀 Inicializar Doriteque en Firebase</h1>
    <p>Este botón cargará el menú y la configuración por defecto en tu base de datos.</p>
    <button id="btn-seed" onclick="seedDatabase()">Cargar Datos en Firebase</button>
    <p id="status"></p>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCYzKKK9Atp-Tl7SAzuoCF2kNBwuy7UNmc",
            authDomain: "doriteque.firebaseapp.com",
            projectId: "doriteque",
            storageBucket: "doriteque.firebasestorage.app",
            messagingSenderId: "7170563290",
            appId: "1:7170563290:web:e2d9755257a18a679299e3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const defaultConfig = {
            nombre: "Doriteque",
            whatsapp: "584245566545",
            email: "Locodori59@gmail.com",
            instagram: "dori__locosss",
            tiktok: "doritequess",
            horario: "Martes a Domingo 12pm - 12am (Lunes cerrado)",
            tasaBs: 36.50,
            metodosPago: ["Pago Móvil", "Efectivo Bs", "Efectivo Divisa"],
            logo: "assets/logo.png"
        };

        const defaultMenu = {
            categorias: [
                { "id": "cat1", "nombre": "Dorilocos", "orden": 1 },
                { "id": "cat2", "nombre": "Hamburguesas", "orden": 2 },
                { "id": "cat3", "nombre": "Bebidas", "orden": 3 },
                { "id": "cat4", "nombre": "Adicionales", "orden": 4 }
            ],
            modificadores: [
                {
                    "id": "mod1", "nombre": "Proteína", "tipo": "unico", "obligatorio": true,
                    "opciones": [ { "id": "opt1", "nombre": "Carne", "precio": 0 }, { "id": "opt2", "nombre": "Pollo", "precio": 0 } ]
                },
                {
                    "id": "mod2", "nombre": "Queso extra", "tipo": "unico", "obligatorio": false,
                    "opciones": [ { "id": "opt3", "nombre": "Ninguno", "precio": 0 }, { "id": "opt4", "nombre": "Queso llanero", "precio": 1.00 }, { "id": "opt5", "nombre": "Queso facilita", "precio": 0.50 } ]
                }
            ],
            productos: [
                { "id": "p1", "nombre": "RUFFLES GRANDE", "descripcion": "Carne, pollo, chorizo, maiz, queso, lechuga, pico de gallo, 5 salsas", "precio": 14.00, "categoriaId": "cat1", "imagen": "", "disponible": true, "modificadoresIds": [] },
                { "id": "p2", "nombre": "HAMBURGUESA NORMAL", "descripcion": "Carne o pollo, queso, mini papas, lechuga, tomate, cebolla, pepinillo, 6 salsas", "precio": 5.50, "categoriaId": "cat2", "imagen": "", "disponible": true, "modificadoresIds": ["mod1", "mod2"] },
                { "id": "p3", "nombre": "COCA-COLA 1LT", "descripcion": "Refresco Coca-Cola de 1 litro", "precio": 1.50, "categoriaId": "cat3", "imagen": "", "disponible": true, "modificadoresIds": [] }
            ]
        };

        window.seedDatabase = async function() {
            const btn = document.getElementById('btn-seed');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = "Conectando con Firebase...";

            try {
                await setDoc(doc(db, 'config', 'main'), defaultConfig);
                status.textContent = "Configuración guardada. Cargando menú...";
                
                await setDoc(doc(db, 'menu', 'main'), defaultMenu);
                status.textContent = "✅ ¡Base de datos inicializada con éxito!";
                status.style.color = "#25D366";
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } catch (error) {
                console.error(error);
                status.textContent = "❌ Error: " + error.message;
                status.style.color = "#FF1744";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
