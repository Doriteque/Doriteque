<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finalizar Pedido - Doriteque</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <a href="carrito.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-arrow-left"></i>
                <h1>Datos de entrega</h1>
            </a>
        </div>
    </header>

    <main class="checkout-container">
        <div id="resumen-final" class="resumen-pedido">
            <!-- Se inyecta con JS -->
        </div>

        <form id="formulario-pedido">
            <div class="form-group">
                <label>Nombre completo <span class="required">*</span></label>
                <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label>Número de teléfono <span class="required">*</span></label>
                <input type="tel" id="telefono" required placeholder="Ej: 0412-1234567">
            </div>

            <div class="form-group">
                <label>Dirección de entrega <span class="required">*</span></label>
                <textarea id="direccion" required placeholder="Urbanización, calle, número de casa, punto de referencia..."></textarea>
            </div>

            <div class="form-group">
                <label>Método de pago <span class="required">*</span></label>
                <select id="metodo-pago" required>
                    <option value="">Selecciona una opción</option>
                    <option value="Pago Móvil">Pago Móvil</option>
                    <option value="Efectivo Bs">Efectivo Bs</option>
                    <option value="Efectivo Divisa">Efectivo Divisa ($)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nota (Opcional)</label>
                <textarea id="nota" placeholder="Ej: Sin cebolla en la hamburguesa, salsa de ajo aparte..."></textarea>
            </div>

            <button type="submit" class="btn-enviar">
                <i class="fa-brands fa-whatsapp"></i> Enviar pedido por WhatsApp
            </button>
        </form>
    </main>

    <script type="module" src="js/checkout.js"></script>
</body>
</html>
