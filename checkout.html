<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://ve.dolarapi.com; frame-src https://doriteque.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido - Doriteque</title>
    <script>
        // Versión que cambia cada 10 min: así el caché nunca deja la página con archivos viejos
        window.V = Math.floor(Date.now() / 600000);
        document.write('<link rel="stylesheet" href="css/style.css?v=' + window.V + '">');
        document.write('<link rel="stylesheet" href="css/checkout.css?v=' + window.V + '">');
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Evita el doble borde en los campos de dirección */
        .address-input-wrapper input,
        .address-detail-wrapper input {
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            box-shadow: none !important;
            width: auto !important;
            min-width: 0;
        }
    </style>
    <script type="module" src="js/firebase-publico.js"></script>
    <script type="module" src="js/db.js"></script>
</head>
<body>
    <header class="checkout-header">
        <button class="btn-back" onclick="window.history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1>Finalizar Pedido</h1>
        <div style="width: 40px;"></div>
    </header>

    <main class="checkout-container">
        <section class="checkout-card">
            <h2 class="card-title">Tu pedido</h2>
            <div class="edit-cart-link" onclick="window.history.back()">
                <i class="fa-solid fa-bars"></i> Editar carrito (<span id="edit-cart-count">0</span>)
            </div>
            <div id="checkout-items" class="checkout-items"></div>
        </section>

        <section class="checkout-card">
            <h2 class="card-title">Método de pago</h2>
            <div id="payment-methods" class="payment-methods"></div>
        </section>

        <section class="checkout-card totals-card">
            <div class="total-row">
                <span>Subtotal</span>
                <span id="checkout-subtotal">USD$ 0.00</span>
            </div>
            <div class="total-row total-final">
                <span>Total</span>
                <span id="checkout-total-usd">USD$ 0.00</span>
            </div>
        </section>

        <section class="checkout-card">
            <h2 class="card-title">Completa tus datos</h2>

            <div class="form-group">
                <label>Nombre completo <span class="required">*</span></label>
                <input type="text" id="client-name" placeholder="Escribe tu nombre completo">
            </div>

            <div class="form-group">
                <label>Nro. de WhatsApp <span class="required">*</span></label>
                <div class="phone-input-wrapper">
                    <div class="country-selector">
                        <span class="flag-emoji">🇻🇪</span>
                        <select id="client-country">
                            <option value="58">+58</option>
                            <option value="57">+57</option>
                            <option value="51">+51</option>
                            <option value="1">+1</option>
                        </select>
                    </div>
                    <input type="tel" id="client-phone" placeholder="Escribe tu número">
                </div>
            </div>

            <div class="form-group">
                <label>Dirección de entrega <span class="required" id="addr-required">*</span></label>

                <div class="address-input-wrapper">
                    <i class="fa-solid fa-map"></i>
                    <input type="text" id="addr-calle" placeholder="Sector, calle, casa o edificio y apto" maxlength="200" autocomplete="off">
                </div>

                <div class="address-detail-wrapper" style="margin-top:10px;">
                    <i class="fa-solid fa-flag"></i>
                    <input type="text" id="addr-ref" placeholder="Punto de referencia" maxlength="120" autocomplete="off">
                </div>

                <button type="button" class="btn-geolocation" id="btn-ubicacion" style="margin-top:14px;">
                    <i class="fa-solid fa-location-crosshairs"></i>
                    <span>Compartir mi ubicación exacta (Google Maps)</span>
                </button>

                <div id="ubicacion-estado" style="display:none;font-size:0.9rem;line-height:1.4;padding:10px 12px;border-radius:10px;margin-bottom:8px;"></div>

                <small id="addr-ayuda" style="display:block;color:#777;font-size:0.85rem;">Escribe tu dirección y un punto de referencia, o comparte tu ubicación con el botón azul.</small>
            </div>

            <div class="form-group">
                <label>Fecha y hora de entrega</label>
                <div class="datetime-display" id="datetime-display">
                    <i class="fa-solid fa-clock"></i>
                    <span id="datetime-text">Calculando...</span>
                </div>
                <input type="hidden" id="client-datetime">
            </div>

            <div class="form-group">
                <label>Observación adicional</label>
                <textarea id="client-note" rows="2" placeholder="Ej: Sin cebolla, salsa aparte..."></textarea>
            </div>
        </section>

        <button class="btn-send-order" onclick="checkout.sendOrder()">
            <i class="fa-brands fa-whatsapp"></i> Enviar pedido por WhatsApp
        </button>

        <p class="checkout-disclaimer">
            <i class="fa-solid fa-circle-info"></i> Se abrirá WhatsApp para enviar el mensaje al negocio.
        </p>
    </main>

    <script>
        document.write('<script src="js/tasa.js?v=' + window.V + '"><\/script>');
        document.write('<script src="js/checkout.js?v=' + window.V + '"><\/script>');
    </script>
</body>
</html>
