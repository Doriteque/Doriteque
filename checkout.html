<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finalizar Pedido - Doriteque</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/db.js"></script>
</head>
<body>
    <header class="checkout-header">
        <button class="btn-back" onclick="window.history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h1>Finalizar Pedido</h1>
        <div style="width: 40px;"></div>
    </header>

    <main class="checkout-container">
        <section class="checkout-card">
            <h2 class="card-title">Tu pedido</h2>
            <div class="edit-cart-link" onclick="window.history.back()">
                <i class="fa-solid fa-bars"></i> Editar carrito (<span id="edit-cart-count">0</span>)
            </div>
            <div id="checkout-items" class="checkout-items"></div>
        </section>

        <section class="checkout-card">
            <h2 class="card-title">Método de pago</h2>
            <div id="payment-methods" class="payment-methods"></div>
        </section>

        <section class="checkout-card totals-card">
            <div class="total-row">
                <span>Subtotal</span>
                <span id="checkout-subtotal">USD$ 0.00</span>
            </div>
            <div class="total-row total-final">
                <span>Total</span>
                <span id="checkout-total-usd">USD$ 0.00</span>
            </div>
        </section>

        <section class="checkout-card">
            <h2 class="card-title">Completa tus datos</h2>
            
            <div class="form-group">
                <label>Nombre completo <span class="required">*</span></label>
                <input type="text" id="client-name" placeholder="Escribe tu nombre completo">
            </div>

            <div class="form-group">
                <label>Nro. de WhatsApp <span class="required">*</span></label>
                <div class="phone-input-wrapper">
                    <div class="country-selector">
                        <span class="flag-emoji">🇻🇪</span>
                        <select id="client-country">
                            <option value="58">+58</option>
                            <option value="57">+57</option>
                            <option value="51">+51</option>
                            <option value="1">+1</option>
                        </select>
                    </div>
                    <input type="tel" id="client-phone" placeholder="Escribe tu número">
                </div>
            </div>

            <div class="form-group">
    <label>Dirección <span class="required">*</span></label>
    <div class="address-input-wrapper" style="margin-bottom: 8px;">
        <i class="fa-solid fa-map"></i>
        <input type="text" id="address-search" placeholder="Escribe tu dirección..." autocomplete="off" autocapitalize="off">
    </div>
    <div id="address-suggestions" class="address-suggestions"></div>
    <div class="address-detail-wrapper" style="margin-top: 8px;">
        <i class="fa-solid fa-location-crosshairs"></i>
        <input type="text" id="address-detail-input" placeholder="Detalle (casa, apto, referencia)" autocapitalize="off">
    </div>
    <input type="hidden" id="client-address">
    <input type="hidden" id="client-address-detail">
</div>

            <div class="form-group">
                <label>Fecha y hora de entrega</label>
                <div class="datetime-display" id="datetime-display">
                    <i class="fa-solid fa-clock"></i>
                    <span id="datetime-text">Calculando...</span>
                </div>
                <input type="hidden" id="client-datetime">
            </div>

            <div class="form-group">
                <label>Observación adicional</label>
                <textarea id="client-note" rows="2" placeholder="Escribe aquí..."></textarea>
            </div>
        </section>

        <button class="btn-send-order" onclick="checkout.sendOrder()">
            <i class="fa-brands fa-whatsapp"></i> Enviar pedido por WhatsApp
        </button>

        <p class="checkout-disclaimer">
            <i class="fa-solid fa-circle-info"></i> Se abrirá WhatsApp para enviar el mensaje al negocio.
        </p>
    </main>

    <script src="js/checkout.js"></script>
</body>
</html>
