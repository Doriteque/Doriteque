<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carrito - Doriteque</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 12px;">
                <i class="fa-solid fa-arrow-left"></i>
                <h1>Mi Pedido</h1>
            </a>
        </div>
    </header>

    <main class="checkout-container">
        <div id="carrito-vacio" class="text-center hidden" style="padding: 60px 20px;">
            <i class="fa-solid fa-cart-arrow-down" style="font-size: 4rem; color: var(--rojo); margin-bottom: 20px;"></i>
            <h3 style="color: var(--blanco); margin-bottom: 12px;">Tu carrito está vacío</h3>
            <p style="color: var(--gris-texto); margin-bottom: 24px;">Agrega productos deliciosos desde el menú.</p>
            <a href="index.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">Ir al menú</a>
        </div>

        <div id="carrito-lleno">
            <h2 class="titulo-seccion">Resumen del pedido</h2>
            <div id="lista-carrito" class="resumen-pedido"></div>

            <div class="resumen-pedido total-box">
                <div class="resumen-item">
                    <span>Subtotal:</span>
                    <span id="subtotal-usd">$0.00</span>
                </div>
                <div class="resumen-total">
                    <span>TOTAL A PAGAR:</span>
                    <div style="text-align: right;">
                        <div id="total-usd" style="color: var(--rojo-brillante);">$0.00</div>
                        <div id="total-bs" style="font-size: 0.9rem; color: var(--gris-texto);">Bs 0.00</div>
                    </div>
                </div>
            </div>

            <a href="checkout.html" class="btn-enviar" style="text-decoration: none; display: block; text-align: center; margin-top: 20px;">
                Continuar con los datos de entrega <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>
    </main>

    <script src="js/firebase.js"></script>
    <script src="js/db.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
